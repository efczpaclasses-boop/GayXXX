name: Create Release

on:
  push:
    branches:
      - builds
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag or timestamp
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="v$(date +%Y.%m.%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            # Plugin Release ${{ steps.version.outputs.version }}
            
            This release contains all CloudStream provider plugins from the builds branch.
            
            **Included Plugins:**
            - All .cs3 plugin files
            - Configuration files (plugins.json)
            
            ## Installation
            Add this repository URL to your CloudStream plugin sources or manually import the .cs3 files.
          draft: false
          prerelease: false
